# Local development services. Production hosting is decided separately (see docs/decisions.md).
# Object storage for photos is added with the photo upload work; nothing uses it yet.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sip
    ports: ["5432:5432"]
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
volumes:
  dbdata:
